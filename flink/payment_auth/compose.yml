services:
  kafka:
    image: confluentinc/cp-kafka:latest
    hostname: kafka
    container_name: kafka
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,LISTENER:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'LISTENER://kafka:29092,EXTERNAL://localhost:9092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'CONTROLLER://kafka:29093,LISTENER://kafka:29092,EXTERNAL://0.0.0.0:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'LISTENER'
    # Replace CLUSTER_ID with a unique base64 UUID using "bin/kafka-storage.sh random-uuid"
    # See https://docs.confluent.io/kafka/operations-tools/kafka-tools.html#kafka-storage-sh
      CLUSTER_ID: 'venpz0h7QE2i8DFV5NZMvQ'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  redpanda-console:
    image: docker.redpanda.com/vectorized/console:latest
    container_name: redpanda-console
    hostname: redpanda-console
    ports:
      - "8088:8080"
    environment:
      KAFKA_BROKERS: "kafka:29092"
      SCHEMAREGISTRY_ENABLED: "false"
      CONNECT_ENABLED: "false"
      KAFKA_AUTHENTICATION_METHOD: "none"
    depends_on:
      - kafka

  flink-jobmanager:
    container_name: flink-jobmanager
    hostname: jobmanager
    ports:
      - '8081:8081'
    command: standalone-job --jars /opt/flink/userlib/flink-aggregation-app.jar
    build: 
      context: ./flink_app
      dockerfile: Dockerfile
    depends_on:
      - kafka
      - redpanda-console
    environment:
      KAFKA_SOURCE_ADDR: 'kafka:29092'
      KAFKA_SINK_ADDR: 'kafka:29092'
      KAFKA_CONS_GROUP_ID: 'flink-group-id'
      INPUT_TOPIC: 'payments'
      OUTPUT_TOPIC: 'potential-fraud'
      FLINK_PROPERTIES: |-
        jobmanager.rpc.address: jobmanager
        parallelism.default: 3

  flink-taskmanager:
    image: flink:1.20
    container_name: flink-taskmanager
    command: taskmanager
    scale: 1
    depends_on:
      - flink-jobmanager
    environment:
      FLINK_PROPERTIES: |-
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 3
        parallelism.default: 3
